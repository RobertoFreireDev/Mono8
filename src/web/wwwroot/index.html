<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mono8</title>
    <!-- Relative, so the published folder also works from a subdirectory or an itch.io zip. -->
    <base href="./" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div id="loading">
            <div>loading</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <!-- KNI's WebGL backend: the JS half of nkast.Wasm.*. The version in each name is the package
         version nkast.Kni.Platform.Blazor.GL depends on — bump these with the package, not apart
         from it, or the runtime silently loses whatever the missing file provided. -->
    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.8.0.11.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.8.0.11.js"></script>
    <!-- js/streamProcessor.js is the other half of the audio and is NOT a script tag: KNI's dynamic
         voice loads it as an AudioWorklet module, by that exact page-relative path, the first time
         anything plays. No package ships it — it comes from KNI's own Blazor template and lives in
         wwwroot/js here. A missing one does not 404 in the console: the load is awaited inside a
         fire-and-forget task, so the voice just stays half-built and throws when it is next stopped. -->
    <script src="_content/nkast.Wasm.XR/js/XR.8.0.11.js"></script>

    <script>
        function fitCanvas()
        {
            var canvas = document.getElementById('theCanvas');
            var holder = document.getElementById('canvasHolder');
            if (!canvas || !holder) return;
            canvas.width = holder.clientWidth;
            canvas.height = holder.clientHeight;
        }

        // The rate the browser's audio output runs at. WebAudio will not resample for us and KNI
        // refuses a voice at any other rate, so the console asks before it builds its channels and
        // reads its 44100 bank into whatever comes back. The context exists only to be measured.
        window.mono8AudioSampleRate = function ()
        {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return 0;
            try
            {
                var ctx = new Ctx();
                var rate = ctx.sampleRate;
                ctx.close();
                return rate;
            }
            catch (e)
            {
                return 0;
            }
        };

        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            fitCanvas();
            // The console draws its own pointer, and right-click is an editor-style input rather
            // than a request for the browser's menu.
            document.getElementById('theCanvas').addEventListener("contextmenu", e => e.preventDefault());

            window.requestAnimationFrame(tickJS);
        };

        // Nothing raises ClientSizeChanged for a canvas, so the game watches its size instead and
        // re-letterboxes itself the frame after this fires. See Mono8Game.SyncCanvasSize.
        window.addEventListener("resize", fitCanvas);

        window.addEventListener("keydown", function(event)
        {
            // Stop the arrow keys and space scrolling the outer page when embedded in an iframe.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Same for the wheel: mouseup()/mousedown() are the console's, not the page's.
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
